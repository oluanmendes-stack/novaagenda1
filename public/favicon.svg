<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Background -->
  <rect width="256" height="256" fill="#3b82f6" rx="40"/>
  
  <!-- Calendar frame -->
  <rect x="40" y="50" width="176" height="180" fill="white" rx="8"/>
  
  <!-- Calendar header (month bar) -->
  <rect x="40" y="50" width="176" height="35" fill="#3b82f6" rx="8" ry="0"/>
  
  <!-- Calendar header text -->
  <text x="128" y="72" font-size="16" font-weight="bold" text-anchor="middle" fill="white" font-family="Arial">2026</text>
  
  <!-- Day grid -->
  <g stroke="#3b82f6" stroke-width="1.5" fill="none">
    <!-- Vertical lines -->
    <line x1="65" y1="90" x2="65" y2="210"/>
    <line x1="90" y1="90" x2="90" y2="210"/>
    <line x1="115" y1="90" x2="115" y2="210"/>
    <line x1="140" y1="90" x2="140" y2="210"/>
    <line x1="165" y1="90" x2="165" y2="210"/>
    <line x1="190" y1="90" x2="190" y2="210"/>
    
    <!-- Horizontal lines -->
    <line x1="40" y1="110" x2="216" y2="110"/>
    <line x1="40" y1="130" x2="216" y2="130"/>
    <line x1="40" y1="150" x2="216" y2="150"/>
    <line x1="40" y1="170" x2="216" y2="170"/>
    <line x1="40" y1="190" x2="216" y2="190"/>
  </g>
  
  <!-- Highlighted date -->
  <circle cx="128" cy="160" r="12" fill="#3b82f6"/>
  <text x="128" y="165" font-size="14" font-weight="bold" text-anchor="middle" fill="white" font-family="Arial">15</text>
  
  <!-- Document icon at bottom -->
  <g transform="translate(128, 230)">
    <rect x="-15" y="-8" width="30" height="20" fill="#3b82f6" rx="2"/>
    <rect x="-13" y="-5" width="26" height="3" fill="white"/>
    <rect x="-13" y="1" width="26" height="2" fill="white" opacity="0.7"/>
  </g>
</svg>
